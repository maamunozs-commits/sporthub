<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas — SportHub Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-sh sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="admin.html">
      <span class="brand-icon"><i class="bi bi-trophy-fill"></i></span>SportHub
      <span class="ms-2 badge-sh badge-navy" style="font-size:.65rem;font-weight:700">ADMIN</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:rgba(255,255,255,.65)">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto ms-3 gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html" target="_blank">Ver sitio</a></li>
      </ul>
      <ul class="navbar-nav align-items-center gap-2" id="nav-user-area"></ul>
    </div>
  </div>
</nav>

<div class="admin-subnav">
  <div class="container-fluid px-4">
    <a href="admin.html"><i class="bi bi-grid-1x2 me-1"></i>Dashboard</a>
    <a href="admin-canchas.html"><i class="bi bi-building me-1"></i>Canchas</a>
    <a href="admin-usuarios.html"><i class="bi bi-people me-1"></i>Usuarios</a>
    <a href="admin-reservas.html" class="active"><i class="bi bi-calendar3 me-1"></i>Reservas</a>
    <a href="admin-horarios.html"><i class="bi bi-clock me-1"></i>Horarios</a>
  </div>
</div>

<main class="py-4">
  <div class="container-fluid px-4">

    <div class="d-flex justify-content-between align-items-start mb-5 flex-wrap gap-3">
      <div>
        <h1 class="fw-bold mb-0" style="font-size:1.4rem">Reservas</h1>
        <p class="text-muted mb-0 mt-1" style="font-size:.875rem">
          <span id="ar-count">Cargando…</span> · Ingresos confirmados: <strong id="ar-ingresos">—</strong>
        </p>
      </div>
    </div>

    
    <div class="card-sh p-3 mb-4">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-4">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search" style="font-size:.82rem"></i></span>
            <input type="text" id="busq-cliente" class="form-control" placeholder="Buscar cliente…">
          </div>
        </div>
        <div class="col-6 col-md-2">
          <select id="filtro-estado" class="form-select">
            <option value="">Todos</option>
            <option value="confirmada">Confirmadas</option>
            <option value="cancelada">Canceladas</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select id="filtro-tipo-ar" class="form-select">
            <option value="">Todos</option>
            <option value="futbol">Fútbol</option>
            <option value="padel">Pádel</option>
            <option value="tenis">Tenis</option>
            <option value="basquetbol">Básquetbol</option>
          </select>
        </div>
        <div class="col-12 col-md-auto">
          <button class="btn btn-outline-sh" onclick="limpiarFiltrosAR()" style="font-size:.875rem">
            <i class="bi bi-x-lg me-1" style="font-size:.8rem"></i>Limpiar
          </button>
        </div>
      </div>
    </div>

    <div class="card-sh">
      <div class="table-responsive p-4">
        <table class="table-sh w-100">
          <thead>
            <tr>
              <th>#</th>
              <th>Cliente</th>
              <th>Cancha</th>
              <th>Fecha</th>
              <th>Hora</th>
              <th>Total</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="reservas-tbody">
            <tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted)">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<footer class="footer mt-4">
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between flex-wrap gap-2">
      <span style="font-size:.78rem">SportHub Admin</span>
      <span style="font-size:.78rem">DSY2202 — Semana 3</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/canchas.js"></script>
<script src="assets/js/reservas.js"></script>
<script src="assets/js/admin.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', initAdminReservas);
  function limpiarFiltrosAR() {
    ['filtro-estado','filtro-tipo-ar','busq-cliente'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    renderTablaReservas();
  }
</script>
</body>
</html>
