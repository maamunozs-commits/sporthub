<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — SportHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="auth-bg">
  <div class="container d-flex align-items-center justify-content-center py-5" style="position:relative;z-index:1">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

        
        <div class="mb-8 text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <div class="auth-logo-text text-white">
              <span class="auth-logo-icon"><i class="bi bi-trophy-fill"></i></span>
              SportHub
            </div>
          </a>
        </div>

        <div class="auth-panel">
          <div class="mb-5">
            <h1 class="fw-bold mb-1" style="font-size:1.4rem">Iniciar sesión</h1>
            <p class="text-muted mb-0" style="font-size:.875rem">Ingresa tus credenciales para continuar</p>
          </div>

          <div id="alert-box" class="mb-4"></div>

          <form id="form-login" novalidate>
            <div class="mb-3">
              <label class="form-label" for="correo">Correo electrónico</label>
              <input type="email" id="correo" class="form-control" placeholder="tu@correo.com" autocomplete="email">
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="form-label mb-0" for="password">Contraseña</label>
                <a href="recuperar.html" style="font-size:.8rem;color:var(--green)">¿Olvidaste tu contraseña?</a>
              </div>
              <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="btn btn-outline-secondary border-start-0" style="border:1.5px solid var(--border);border-left:none" onclick="togglePw('password','ico-eye')">
                  <i class="bi bi-eye" id="ico-eye" style="font-size:.85rem"></i>
                </button>
              </div>
            </div>

            <button type="submit" class="btn btn-dark-sh w-100 py-2">Iniciar sesión</button>
          </form>

          <div class="text-center mt-4" style="font-size:.875rem">
            <span class="text-muted">¿No tienes cuenta?</span>
            <a href="registro.html" style="color:var(--green);font-weight:600;margin-left:.35rem">Regístrate gratis</a>
          </div>
        </div>

        
        <div class="mt-3 p-3 rounded-3" style="background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)">
          <p class="mb-2" style="font-size:.75rem;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.06em">
            Cuentas de demostración
          </p>
          <div class="row g-2">
            <div class="col-6">
              <div style="font-size:.78rem;color:rgba(255,255,255,.5)">Admin</div>
              <div style="font-size:.8rem;color:rgba(255,255,255,.8);font-weight:500">admin@sporthub.cl</div>
              <div style="font-size:.78rem;color:rgba(255,255,255,.5)">Admin123!</div>
            </div>
            <div style="width:1px;background:rgba(255,255,255,.1)"></div>
            <div class="col-5">
              <div style="font-size:.78rem;color:rgba(255,255,255,.5)">Cliente</div>
              <div style="font-size:.8rem;color:rgba(255,255,255,.8);font-weight:500">cliente@sporthub.cl</div>
              <div style="font-size:.78rem;color:rgba(255,255,255,.5)">Cliente123!</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/canchas.js"></script>
<script src="assets/js/reservas.js"></script>
<script src="assets/js/admin.js"></script>
<script>
  initLogin();
  function togglePw(inp, ico) {
    const el = document.getElementById(inp);
    const ic = document.getElementById(ico);
    el.type = el.type === 'password' ? 'text' : 'password';
    ic.className = el.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
    ic.style.fontSize = '.85rem';
  }
</script>
</body>
</html>
