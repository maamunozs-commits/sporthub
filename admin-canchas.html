<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canchas — SportHub Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-sh sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="admin.html">
      <span class="brand-icon"><i class="bi bi-trophy-fill"></i></span>SportHub
      <span class="ms-2 badge-sh badge-navy" style="font-size:.65rem;font-weight:700">ADMIN</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="color:rgba(255,255,255,.65)">
      <i class="bi bi-list fs-4"></i>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav me-auto ms-3 gap-1">
        <li class="nav-item"><a class="nav-link" href="index.html" target="_blank">Ver sitio</a></li>
      </ul>
      <ul class="navbar-nav align-items-center gap-2" id="nav-user-area"></ul>
    </div>
  </div>
</nav>

<div class="admin-subnav">
  <div class="container-fluid px-4">
    <a href="admin.html"><i class="bi bi-grid-1x2 me-1"></i>Dashboard</a>
    <a href="admin-canchas.html" class="active"><i class="bi bi-building me-1"></i>Canchas</a>
    <a href="admin-usuarios.html"><i class="bi bi-people me-1"></i>Usuarios</a>
    <a href="admin-reservas.html"><i class="bi bi-calendar3 me-1"></i>Reservas</a>
    <a href="admin-horarios.html"><i class="bi bi-clock me-1"></i>Horarios</a>
  </div>
</div>

<main class="py-4">
  <div class="container-fluid px-4">

    <div class="d-flex justify-content-between align-items-center mb-5 flex-wrap gap-3">
      <div>
        <h1 class="fw-bold mb-0" style="font-size:1.4rem">Canchas</h1>
        <p class="text-muted mb-0 mt-1" style="font-size:.875rem" id="canchas-count"></p>
      </div>
      <button class="btn btn-dark-sh" onclick="abrirNuevaCancha()">
        <i class="bi bi-plus me-1"></i>Nueva cancha
      </button>
    </div>

    
    <div class="card-sh p-3 mb-4">
      <div class="input-group" style="max-width:340px">
        <span class="input-group-text"><i class="bi bi-search" style="font-size:.82rem"></i></span>
        <input type="text" id="busq-cancha" class="form-control" placeholder="Buscar cancha…">
      </div>
    </div>

    
    <div class="card-sh">
      <div class="table-responsive p-4">
        <table class="table-sh w-100">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Precio/hr</th>
              <th>Capacidad</th>
              <th>Reservas</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="canchas-tbody">
            <tr><td colspan="7" class="text-center py-4" style="color:var(--text-muted)">Cargando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>


<div class="modal fade" id="modalCancha" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0" style="border-radius:var(--r-lg);box-shadow:var(--sh-lg)">
      <div class="modal-header" style="background:var(--navy);border-radius:var(--r-lg) var(--r-lg) 0 0;border-bottom:none;padding:1.25rem 1.5rem">
        <h5 class="modal-title fw-bold text-white" id="modal-cancha-titulo">Nueva cancha</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-5">
        <div id="alert-cancha" class="mb-4"></div>
        <form id="form-cancha" novalidate>
          <input type="hidden" id="cancha-id">
          <div class="row g-4">
            <div class="col-12">
              <label class="form-label">Nombre <span class="text-danger">*</span></label>
              <input type="text" id="cancha-nombre" class="form-control" placeholder="Ej: Cancha Fútbol Premium">
            </div>
            <div class="col-md-6">
              <label class="form-label">Tipo <span class="text-danger">*</span></label>
              <select id="cancha-tipo" class="form-select">
                <option value="">Seleccionar…</option>
                <option value="futbol">Fútbol</option>
                <option value="padel">Pádel</option>
                <option value="tenis">Tenis</option>
                <option value="basquetbol">Básquetbol</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Precio/hr (CLP) <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="cancha-precio" class="form-control" min="1" placeholder="15000">
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Capacidad</label>
              <input type="number" id="cancha-capacidad" class="form-control" min="1" placeholder="10">
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado <span class="text-danger">*</span></label>
              <select id="cancha-estado" class="form-select">
                <option value="">Seleccionar…</option>
                <option value="disponible">Disponible</option>
                <option value="no disponible">No disponible</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">Descripción</label>
              <textarea id="cancha-descripcion" class="form-control" rows="3" placeholder="Descripción, instalaciones disponibles…"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer" style="border-top:1px solid var(--border);padding:1rem 1.5rem">
        <button type="button" class="btn btn-outline-sh" data-bs-dismiss="modal" onclick="limpiarFormCancha()">Cancelar</button>
        <button type="button" class="btn btn-dark-sh px-4" onclick="guardarCancha()">Guardar</button>
      </div>
    </div>
  </div>
</div>

<footer class="footer mt-4">
  <div class="container-fluid px-4">
    <div class="d-flex justify-content-between flex-wrap gap-2">
      <span style="font-size:.78rem">SportHub Admin</span>
      <span style="font-size:.78rem">DSY2202 — Semana 3</span>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/canchas.js"></script>
<script src="assets/js/reservas.js"></script>
<script src="assets/js/admin.js"></script>
<script>document.addEventListener('DOMContentLoaded', initAdminCanchas);</script>
</body>
</html>
