<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña — SportHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="auth-bg">
  <div class="container d-flex align-items-center justify-content-center py-5" style="position:relative;z-index:1">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">

        <div class="mb-4 text-center">
          <a href="index.html" class="text-decoration-none">
            <div class="auth-logo-text text-white">
              <span class="auth-logo-icon"><i class="bi bi-trophy-fill"></i></span>
              SportHub
            </div>
          </a>
        </div>

        <div class="auth-panel">
          <div class="mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3"
                 style="width:48px;height:48px;background:var(--green-50);border:1px solid #BBF7D0">
              <i class="bi bi-envelope-at" style="font-size:1.35rem;color:var(--green)"></i>
            </div>
            <h1 class="fw-bold mb-1" style="font-size:1.4rem">Recuperar contraseña</h1>
            <p class="text-muted mb-0" style="font-size:.875rem">
              Ingresa tu correo y te enviaremos instrucciones para restablecer tu contraseña.
            </p>
          </div>

          <div id="alert-box" class="mb-3"></div>

          <form id="form-recuperar" novalidate>
            <div class="mb-4">
              <label class="form-label" for="correo">Correo electrónico</label>
              <input type="email" id="correo" class="form-control" placeholder="tu@correo.com" autocomplete="email">
            </div>
            <button type="submit" class="btn btn-dark-sh w-100 py-2">Enviar instrucciones</button>
          </form>

          <div class="d-flex justify-content-between mt-4" style="font-size:.875rem">
            <a href="login.html" style="color:var(--text-muted);text-decoration:none">
              <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
            <a href="registro.html" style="color:var(--green);font-weight:600;text-decoration:none">Crear cuenta</a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/canchas.js"></script>
<script src="assets/js/reservas.js"></script>
<script src="assets/js/admin.js"></script>
<script>initRecuperar();</script>
</body>
</html>
